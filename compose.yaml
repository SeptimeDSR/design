# Usine SEPTIM : `docker compose up -d` puis ouvre l'adresse affichée par `docker compose logs septim`.
# Gratuit par défaut (Remotion, Piper, banques libres). Rien ne se publie sans « OUI #ref », rien ne dépense de crédit.
name: septim

services:
  septim:
    build: .
    image: septim:local
    init: true
    restart: unless-stopped
    # Chromium a besoin de mémoire partagée pour rendre une vidéo 1080×1920.
    shm_size: 1gb
    # Ton .env (clés Pexels, Postiz, token…) est lu s'il existe ; les lignes ci-dessous passent avant lui.
    env_file:
      - path: .env
        required: false
    environment:
      VIRAL_HOME: /data
      SEPTIM_HOST: 0.0.0.0
      SEPTIM_PORT: "4321"
      SEPTIM_PUBLISHED_PORT: ${SEPTIM_PORT:-4321}
      # Console par défaut : le Studio marche tout de suite. WhatsApp : VIRAL_NOTIFIER=whatsapp dans .env, puis scanne le QR de `docker compose logs -f septim`.
      VIRAL_NOTIFIER: ${VIRAL_NOTIFIER:-console}
      REMOTION_BROWSER_EXECUTABLE: /usr/bin/chromium
      WHATSAPP_CHROME_PATH: /usr/bin/chromium
      # L'Ollama de ton PC (tes modèles y sont déjà). Sans Ollama chez toi : COMPOSE_PROFILES=ollama-local et SEPTIM_OLLAMA_HOST=http://ollama:11434 dans .env.
      OLLAMA_HOST: ${SEPTIM_OLLAMA_HOST:-http://host.docker.internal:11434}
      VIRAL_OLLAMA_MODEL: ${VIRAL_OLLAMA_MODEL:-qwen2.5:3b}
      # Ta musique : dépose des mp3 ou wav dans le dossier « musique » à côté de compose.yaml.
      VIRAL_MUSIC_DIR: /data/music
    depends_on:
      ollama:
        condition: service_healthy
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Seulement cette machine. SEPTIM_BIND=0.0.0.0 ouvre au Wi-Fi (téléphone) : le token reste exigé.
      - "${SEPTIM_BIND:-127.0.0.1}:${SEPTIM_PORT:-4321}:4321"
    volumes:
      # Volume Docker par défaut ; SEPTIM_DATA=./septim-data pour voir les fichiers dans ton dossier.
      - ${SEPTIM_DATA:-septim-data}:/data
      - ${SEPTIM_MUSIC:-./musique}:/data/music:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4321/api/v1/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  # Ollama dans Docker : seulement si tu n'en as pas sur ton PC (COMPOSE_PROFILES=ollama-local). Le modèle se télécharge depuis Réglages.
  ollama:
    profiles: [ollama-local]
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    # GPU NVIDIA (optionnel, nécessite nvidia-container-toolkit) : décommente.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  septim-data:
  ollama:
